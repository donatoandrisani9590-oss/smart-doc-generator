name: Deploy Staging

on:
  push:
    branches: [staging, develop]
  workflow_dispatch:  # Manual trigger

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  # ─── Run CI first ──────────────────────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml

  # ─── Deploy Frontend to Vercel (Preview) ───────────────────
  deploy-frontend-staging:
    name: Deploy Frontend (Staging)
    runs-on: ubuntu-latest
    needs: ci
    environment: staging
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Deploy to Vercel (Preview)
        run: npx vercel --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ─── Deploy Backend to Railway (Staging) ───────────────────
  deploy-backend-staging:
    name: Deploy Backend (Staging)
    runs-on: ubuntu-latest
    needs: ci
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (Staging)
        run: railway up --service web --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}

  # ─── Post-Deploy Health Check ──────────────────────────────
  health-check:
    name: Staging Health Check
    runs-on: ubuntu-latest
    needs: [deploy-frontend-staging, deploy-backend-staging]
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check staging backend health
        run: |
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.STAGING_BACKEND_URL }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Staging backend healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying in 15s..."
            sleep 15
          done
          echo "Staging health check failed"
          exit 1
